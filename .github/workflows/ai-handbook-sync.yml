name: Sync public AI handbook

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-handbook-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Sync handbook sources
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          AI_SYNC_RESUME: '1'
        shell: bash
        run: |
          delays=(0 60 300 900)
          status=1
          for index in "${!delays[@]}"; do
            delay="${delays[$index]}"
            if (( delay > 0 )); then
              echo "Retrying from the local checkpoint in ${delay} seconds."
              sleep "$delay"
            fi
            if npm run ai:sync; then
              exit 0
            else
              status=$?
            fi
            echo "AI sync attempt $((index + 1)) failed; checkpoint retained."
          done
          exit "$status"

      - name: Prepare public content
        run: npm run prepare-content

      - name: Build and verify public site
        run: npm run build

      - name: Commit synchronized content
        shell: bash
        run: |
          git add -- source-ai/content
          if git diff --cached --quiet; then
            echo "No handbook content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ai): refresh public handbook"
          git push origin "HEAD:${GITHUB_REF_NAME}"
